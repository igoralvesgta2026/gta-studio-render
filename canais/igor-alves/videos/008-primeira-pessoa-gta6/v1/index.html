:root{--ouro:#F36A78;--bg:#0a0b0f;--line:#23262f;--txt:#e9ecf1;--mut:#8a93a3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Barlow Condensed',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:.03em} header p{margin:2px 0 0;color:var(--mut);font-size:15px}
.tag{color:var(--mut);font-size:14px;white-space:nowrap}
main{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px 20px}
@media (max-width:900px){main{grid-template-columns:1fr} #lista{max-height:200px}}
#lista{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}
#lista button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:15px;color:#c9cdd6}
#lista button i{font-style:normal;color:var(--mut);font-size:12px} #lista button small{margin-left:auto;color:var(--mut);font-size:12px}
#lista button.on{background:linear-gradient(90deg,#3B146B,#7B208F);color:#fff}
#viewport{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
#cam,.abs{position:absolute} #cam{inset:0}
#capa{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.55);cursor:pointer}
#capa b{font:800 64px 'Barlow Condensed';color:#fff;background:linear-gradient(90deg,#C9349B,#F36A78,#FF9B55);border-radius:999px;padding:22px 60px}
#capa.off{display:none}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ctrl button{font:700 16px 'Barlow Condensed';color:var(--txt);background:#1b1e26;border:1px solid #2b2f3a;border-radius:8px;padding:7px 12px;cursor:pointer}
.ctrl button.on{border-color:#F36A78} .ctrl .sep{width:1px;height:22px;background:var(--line)}
#scrub{flex:1;min-width:160px} #tempo{font-variant-numeric:tabular-nums;color:var(--mut)}
.info{margin-top:12px} .card{background:#12141a;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card h3{margin:0 0 4px;font-size:17px} #nFrase{font-size:15px;color:#cfd5df;line-height:1.5;margin:0}
</style>
</head>
<body>
<header>
  <div><h1>ELE PREVIU O GTA 6 AOS 24 ANOS <span style="font-size:15px;color:var(--mut)">· VÍDEO 008 · V1 · ~40% MOTION</span></h1>
  <p>Voz do Igor (ElevenLabs), jogo em tela cheia no ritmo da fala, cartelas pretas e motion HUD Leônida só onde explica.</p></div>
  <span class="tag">129 cenas · 1920×1080 · espaço = play · ← → = 5 s</span>
</header>
<main>
  <aside id="lista"></aside>
  <section>
    <div id="viewport"><div id="stage"><div id="cam"></div><div id="capa"><b>▶ Tocar</b></div></div></div>
    <div class="ctrl">
      <button id="bPlay">▶ Tocar</button><button id="bRe">↺ Do início</button><span class="sep"></span>
      <button data-sp="1" class="on">1×</button><button data-sp="0.5">0,5×</button><button data-sp="0.25">0,25×</button><span class="sep"></span>
      <button id="bMus" class="on">♪ Música</button><button id="bSfx" class="on">✦ Efeitos</button><button id="bLeg">Legenda</button>
      <input id="scrub" type="range" min="0" max="1000" value="0"><span id="tempo">0:00</span>
    </div>
    <div id="tlOuro"></div>
    <div class="info"><div class="card"><h3 id="nTit">—</h3><p id="nFrase">—</p></div></div>
  </section>
</main>
<script src="gsap.min.js"></script>
<script src="palavras.js"></script>
<script src="frases.js"></script>
<script>
/* ===== KIT HUD LEÔNIDA ===== */
/* =====================================================================
   HUD LEÔNIDA — kit de grafismos com a identidade de interface do GTA 6
   (canal Igor Alves · 04/11/2026)

   Desenho PRÓPRIO inspirado no vocabulário de HUD do jogo (barra de atributo
   com ícone redondo, minimapa com rota rosa, cartões translúcidos da roda de
   seleção, paleta poente de Vice City). Não copia logo nem arte oficial:
   logos, quando precisar, vêm dos PNGs da biblioteca do canal.

   Uso: carregar gsap antes. Todas as funções recebem a timeline (tl) e o
   instante de entrada (t) e devolvem o elemento raiz. Nada fica visível antes
   de t (regra do canal: invisível de verdade até o quadro de entrada).
   Palco 1920x1080. Raiz padrão: #stage (ou HUD.raiz = elemento).
   ===================================================================== */
(function () {
  const P = {
    // paleta poente (referência GTA VI, do mais escuro ao mais claro)
    violeta: '#3B146B', roxo: '#7B208F', magenta: '#C9349B', rosaCoral: '#F36A78',
    coral: '#F87572', laranja: '#FF9B55', amarelo: '#FFB458',
    // HUD
    vida: '#F4A3BF', alerta: '#A98BFF', ciano: '#3FE3D2', rota: '#FF5FA2',
    hudEsc: 'rgba(28,30,36,.92)', hudVidro: 'rgba(214,220,228,.16)', borda: '#0b0c0f',
    branco: '#F4F5F7', azul: '#1A8CFF', verm: '#ff3b4e',
  };
  const POENTE = `linear-gradient(90deg,${P.magenta},${P.rosaCoral} 45%,${P.laranja} 80%,${P.amarelo})`;
  const POENTE_V = `linear-gradient(180deg,${P.roxo},${P.magenta} 35%,${P.rosaCoral} 60%,${P.laranja} 85%,${P.amarelo})`;
  const FONTE = "'Barlow Condensed','Archivo Black',sans-serif";

  /* som: cada peça avisa quando entra (o montador transforma em sfx.mp3). HUD.onSom(tipo, t) */
  const som = (tipo, t) => { try { HUD.onSom && HUD.onSom(tipo, t); } catch (e) {} };
  const raiz = () => (typeof HUD.raiz === 'function' ? HUD.raiz() : HUD.raiz) || document.getElementById('stage') || document.body;
  function el(tag, css, html, parent) {
    const e = document.createElement(tag);
    if (css) Object.assign(e.style, css);
    if (html != null) e.innerHTML = html;
    (parent || raiz()).appendChild(e);
    return e;
  }
  const abs = (x, y, css = {}) => Object.assign({ position: 'absolute', left: x + 'px', top: y + 'px' }, css);
  const esconde = e => (gsap.set(e, { autoAlpha: 0 }), e);
  const mostra = (tl, e, t) => tl.set(e, { autoAlpha: 1 }, t);

  /* ---------- ícones próprios (preenchimento sólido, estilo HUD) ---------- */
  const ICO = {
    coracao: c => `<svg viewBox="0 0 64 64"><path d="M32 54 C10 40 6 28 10 19 c4-9 16-11 22-2 c6-9 18-7 22 2 c4 9 0 21-22 35z" fill="${c}"/></svg>`,
    olho: c => `<svg viewBox="0 0 64 64"><path d="M4 32 C14 16 50 16 60 32 C50 48 14 48 4 32z" fill="${c}"/><circle cx="32" cy="32" r="8" fill="#1c1e24"/></svg>`,
    estrela: c => `<svg viewBox="0 0 64 64"><path d="M32 6l7.6 16.4 17.9 2.1-13.2 12.2 3.5 17.7L32 45.6 16.2 54.4l3.5-17.7L6.5 24.5l17.9-2.1z" fill="${c}"/></svg>`,
    raio: c => `<svg viewBox="0 0 64 64"><path d="M36 4 L12 36 h16 l-4 24 L52 26 H36z" fill="${c}"/></svg>`,
    dinheiro: c => `<svg viewBox="0 0 64 64"><rect x="6" y="16" width="52" height="32" rx="6" fill="${c}"/><circle cx="32" cy="32" r="9" fill="#1c1e24"/><circle cx="32" cy="32" r="4" fill="${c}"/></svg>`,
    garfo: c => `<svg viewBox="0 0 64 64"><path d="M20 6v18a6 6 0 0 0 4 5.6V58h6V29.6A6 6 0 0 0 34 24V6h-4v16h-2V6h-4v16h-2V6z M44 6c-6 4-8 14-8 22h6v30h6V6z" fill="${c}"/></svg>`,
    lua: c => `<svg viewBox="0 0 64 64"><path d="M40 6a26 26 0 1 0 18 40A22 22 0 0 1 40 6z" fill="${c}"/></svg>`,
    carro: c => `<svg viewBox="0 0 64 64"><path d="M8 40v-8l6-12c1-3 4-4 7-4h22c3 0 6 1 7 4l6 12v8a4 4 0 0 1-4 4h-2a6 6 0 0 1-12 0H26a6 6 0 0 1-12 0h-2a4 4 0 0 1-4-4zm10-10h28l-4-8H22z" fill="${c}"/></svg>`,
    punho: c => `<svg viewBox="0 0 64 64"><path d="M14 30c0-5 3-8 7-8h3v-4c0-3 2-5 5-5s5 2 5 5v-1c0-3 2-5 5-5s5 2 5 5v2c1-1 2-1 3-1 3 0 5 2 5 5v14c0 10-8 18-18 18h-4C21 55 14 48 14 39z" fill="${c}"/></svg>`,
    pistola: c => `<svg viewBox="0 0 64 64"><path d="M6 18h48v10H34l-2 4h-6l-3 14c-.4 2-2 3-4 3h-6c-2 0-3-2-2.6-4L14 28H6z" fill="${c}"/></svg>`,
    binoculo: c => `<svg viewBox="0 0 64 64"><rect x="8" y="22" width="20" height="30" rx="6" fill="${c}"/><rect x="36" y="22" width="20" height="30" rx="6" fill="${c}"/><rect x="24" y="26" width="16" height="10" fill="${c}"/><rect x="12" y="12" width="12" height="12" rx="3" fill="${c}"/><rect x="40" y="12" width="12" height="12" rx="3" fill="${c}"/></svg>`,
    mais: c => `<svg viewBox="0 0 64 64"><path d="M30 18h4v12h12v4H34v12h-4V34H18v-4h12z" fill="${c}"/></svg>`,
  };
  const icone = (nome, cor, tam) => {
    const f = ICO[nome] || ICO.estrela;
    return f(cor).replace('<svg ', `<svg width="${tam}" height="${tam}" `);
  };

  /* =====================================================================
     1) BARRAS DE ATRIBUTO — ícone em círculo escuro + barra com borda preta.
     itens: [{icone:'coracao', cor:P.vida, valor:.55, marca:.62, rotulo:'GTA 5'}]
     Uso: comparar duas coisas (GTA 5 x GTA 6), "nível" de algo, medo/fome/sono.
     ===================================================================== */
  function barras(tl, t, itens, { x = 220, y = 330, larg = 780, alt = 58, gap = 150, dur = 1.1, rotulos = true } = {}) {

  /* =====================================================================

  /* =====================================================================

      }), icone(c.icone || 'mais', c.icone && c.icone !== 'mais' ? '#2b2e36' : '#e9ecf1', c.icone === 'mais' ? 44 : (c.num ? 62 : 84)), box);

  /* =====================================================================

  let gid = 0;

  /* =====================================================================

  /* ---------- núcleo: camada + cena com câmera em deriva + saída ---------- */

  function camada(tl, t, o, persp) {

      const c = mk('div', 'ex-logo ex-3d', cena, { left: px(x - cw / 2), top: px(y0 + 270), width: px(cw), height: '124px' }, r.logo ? logo(r.logo, cw < 260 ? .82 : 1) : `<span style="font:800 44px ${FT};color:#111;text-transform:uppercase">${r.texto || ''}</span>`);
      entra(tl, c, ti, { scale: .8, y: -14 }, {}, .32, 'back.out(1.8)'); som('card2', ti);

    });
    const m = folhas.length, ef = Math.min(270, 1500 / Math.max(1, m));
    folhas.forEach((f, i) => {
      const x = 960 + (i - (m - 1) / 2) * ef, ti = f.t ?? T(o, n + i, ult + .45 + i * .4);

        f.foto ? '' : (f.ini || iniciais(f.nome)));
      if (f.foto) { const im = mk('img', '', av, { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', borderRadius: '50%' }); im.src = EX.base + f.foto; }
      const pl = mk('div', 'ex-ic', av, { position: 'absolute', right: '-4px', bottom: '2px', width: '44px', height: '44px', background: AZ, border: '3px solid #07080b' }, `<span style="margin-left:5px;border-left:15px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent"></span>`);

  /* =====================================================================
     4) BARRAS 3D (chão de grade, contagem, pílula comparativa, imagem na barra)
     ===================================================================== */
  const fmtNum = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + ' MI' : v >= 1000 ? Math.round(v / 1000) + ' MIL' : String(Math.round(v));
  EX.barras3d = function (tl, t, itens, o = {}) {
    const { alturaMax = 620, larg: W = 190, prof: D = 150, chao = true, camera = true, formato = fmtNum, pilulas = [], selo } = o;
    const n = itens.length, esp = o.esp || Math.min(430, 1300 / Math.max(1, n - 1));
    const box = camada(tl, t, o, { p: 1500, x: 960, y: 324 });
    const mundo = mk('div', 'ex-3d', box, { left: '960px', top: '780px', width: 0, height: 0 });
    if (chao) mk('div', 'ex-chao', mundo);
    const xs = itens.map((_, i) => (i - (n - 1) / 2) * esp);
    const ESC = alturaMax / Math.max(...itens.map(i => i.valor));
    const ts = itens.map((it, i) => it.t ?? T(o, i, t + .5 + i * 2.4));
    const fins = [];
    itens.forEach((it, i) => {
      const b = mk('div', 'ex-3d', mundo, { left: 0, top: 0, width: 0, height: 0 });
      gsap.set(b, { x: xs[i] - W / 2 });
      const img = it.img ? `url("${EX.base + it.img}")` : '';
      const lis = it.listras ? `repeating-linear-gradient(135deg,${it.listras === true ? '#a3121f' : it.listras} 0 16px,${it.listras === true ? '#7c0d18' : 'rgba(0,0,0,.35)'} 16px 32px)` : '';
      const pele = lis ? { background: lis } : img ? { backgroundColor: '#0b1424', backgroundImage: img, backgroundSize: 'cover', backgroundPosition: '62% 50%' } : { background: it.cor || AZ };
      const face = (css, extra) => mk('div', '', b, Object.assign({ position: 'absolute', bottom: 0, boxSizing: 'border-box' }, pele, css, extra || {}));
      const fr = face({ left: 0, width: px(W), transform: `translateZ(${D / 2}px)` }, Object.assign({ border: '3px solid rgba(255,255,255,.85)', borderBottom: 'none' }, img && !lis ? { backgroundSize: 'auto 135%' } : {}));
      const ld = face({ left: px(W - D / 2), width: px(D), transform: 'rotateY(90deg)', filter: 'brightness(.45)' });
      const le = face({ left: px(-D / 2), width: px(D), transform: 'rotateY(-90deg)', filter: 'brightness(.45)' });
      const tp = face({ left: 0, width: px(W), height: px(D), transform: 'rotateX(90deg)', filter: 'brightness(1.25)', border: '3px solid rgba(255,255,255,.9)' });
      const nw = mk('div', '', b, { position: 'absolute', left: px(W / 2), transform: 'translateX(-50%)' });
      const num = mk('div', 'ex-num', nw, null, '0');
      const lw = mk('div', '', b, { position: 'absolute', left: px(W / 2), top: 0, transform: `translate3d(-50%,36px,${D / 2 + 30}px)` });
      const lg = mk('div', '', lw, { minWidth: '200px', height: '84px', padding: '0 18px', boxSizing: 'border-box', borderRadius: '12px', background: 'rgba(28,30,36,.92)', border: `2px solid ${rgba(AZ, .85)}`, display: 'grid', placeItems: 'center', font: `800 40px ${FT}`, letterSpacing: '.06em', color: '#fff', whiteSpace: 'nowrap', boxShadow: `0 0 20px ${rgba(AZ, .35)}` }, it.rotulo || '');
      const set = h => { [fr, ld, le].forEach(f => f.style.height = px(h)); tp.style.bottom = px(h - D / 2); nw.style.bottom = px(h + 70); };
      set(0); gsap.set(b, { autoAlpha: 0 });
      const ti = ts[i], dur = it.dur || 1.4, pr = { v: 0 };
      const final = it.texto || (formato(it.valor, it) + (it.mais ? '+' : ''));
      tl.set(b, { autoAlpha: 1 }, ti - .35);
      entra(tl, lg, ti - .35, { y: 20 }, {}, .3, 'back.out(2)'); som('barra', ti - .35);
      tl.fromTo(pr, { v: 0 }, { v: it.valor, duration: dur, ease: 'power2.out', immediateRender: false, onUpdate: () => { set(pr.v * ESC); num.textContent = formato(pr.v, it); } }, ti)
        .call(() => { num.textContent = final; }, null, ti + dur)
        .fromTo(num, { scale: 1.25 }, { scale: 1, duration: .3, ease: 'back.out(2)', immediateRender: false }, ti + dur);
      som('numero', ti);
      fins.push(ti + dur);
    });
    const porBarra = {};
    pilulas.forEach((p, k) => {
      const i = p.barra ?? n - 1, h = itens[i].valor * ESC, j = porBarra[i] = (porBarra[i] || 0) + 1;
      const w = mk('div', 'ex-3d', mundo, { left: 0, top: 0 });
      gsap.set(w, { x: xs[i] - W / 2 - 24, y: -h + 30 + (j - 1) * 64, z: D / 2 });
      mk('div', '', w, { transform: 'translateX(-100%)' }, pilula(p.texto, { fundo: AZ, cor: '#fff', tam: 32 }));
      const tp = p.t ?? Math.max(...fins) + .3 + k * .35;
      entra(tl, w.firstChild.firstChild, tp, { scale: .5 }, {}, .35, 'back.out(2.4)'); som('escolhe', tp);
    });
    // câmera: começa perto e baixa na 1ª barra, recua a cada barra nova; deriva no fim
    const K = k => { const f = n > 1 ? k / (n - 1) : 1, foco = xs.slice(0, k + 1).reduce((a, b) => a + b, 0) / (k + 1); return { x: -foco, y: 40 + 130 * f, z: 520 - 1040 * f, rx: -18 + 4 * f, ry: -22 + 9 * f }; };
    const cam = camera ? K(0) : K(n - 1);
    const aplica = () => { mundo.style.transform = `translate3d(${cam.x}px,${cam.y}px,${cam.z}px) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg)`; };
    aplica();
    const fimCena = temFim(o) ? o.ate : Math.max(...fins) + 3.5;
    if (camera && n > 1) {
      let fimAnt = t;
      const ini = [];
      for (let k = 1; k < n; k++) { const s = Math.max(ts[k] - .75, fimAnt + .05); ini.push(s); fimAnt = s + 1.3; }
      const k0 = K(0);
      tl.fromTo(cam, Object.assign({}, k0), { x: k0.x - 50, z: k0.z - 90, duration: Math.max(.3, ini[0] - t), ease: 'sine.inOut', immediateRender: false, onUpdate: aplica }, t);
      for (let k = 1; k < n; k++) tl.to(cam, Object.assign(K(k), { duration: 1.3, ease: 'power2.inOut', onUpdate: aplica }), ini[k - 1]);
      const kf = K(n - 1);
      tl.to(cam, { x: kf.x - 30, y: kf.y + 5, z: kf.z - 80, ry: kf.ry + 4, duration: Math.max(.5, fimCena - fimAnt), ease: 'sine.inOut', onUpdate: aplica }, fimAnt);
    } else {
      const kf = K(n - 1);
      tl.fromTo(cam, Object.assign({}, kf), { x: kf.x - 40, z: kf.z - 90, ry: kf.ry + 5, duration: Math.max(.5, fimCena - t), ease: 'sine.inOut', immediateRender: false, onUpdate: aplica }, t);
    }
    if (selo) EX.selo(tl, selo.t ?? Math.max(...fins) + .6, Object.assign({ canto: 'id' }, selo, { pai: box, ate: undefined }));
    return box;
  };

  /* =====================================================================
     5) PESSOA / CARTÃO DE QUEM DISSE
     ===================================================================== */
  EX.pessoa = function (tl, t, o = {}) {
    const { nome = 'NOME', cargo = '', empresa, fonte, foto, x = 960, y = 540, cor = AZ } = o;

  EX.cartaoQuem = EX.pessoa;

  /* =====================================================================
     6) SELO (fonte + estado) e CARIMBO

  const ESTADOS = {
    CONFIRMADO: { cor: CI, ic: 'check' }, OFICIAL: { cor: CI, ic: 'check' }, REAL: { cor: CI, ic: 'check' }, VERDADE: { cor: CI, ic: 'check' },
    INFERIDO: { cor: AL, ic: 'olho' }, 'ESPECULAÇÃO': { cor: AL, ic: 'olho' }, TEORIA: { cor: AL, ic: 'olho' },
    PATENTE: { cor: AZ, ic: 'documento' }, DOCUMENTO: { cor: AZ, ic: 'documento' },

  };
  EX.selo = function (tl, t, o = {}) {

    const pos = { se: { left: '56px', top: '50px' }, sd: { right: '56px', top: '50px' }, ie: { left: '56px', bottom: '52px' }, id: { right: '56px', bottom: '52px' } }[canto] || {};

    const el = mk('div', '', box, Object.assign({ position: 'absolute', display: 'flex', alignItems: 'center', gap: '14px' }, pos));
    let chip = null;
    const esq = canto[1] === 'e';
    if (fonte || texto) {
      const s = mk('div', '', el, { display: 'flex', alignItems: 'center', gap: '14px', background: 'rgba(28,30,36,.94)', border: `2px solid ${rgba(AZ, .85)}`, borderRadius: '12px', padding: '10px 20px 10px 10px', boxShadow: `0 0 18px ${rgba(AZ, .3)},0 10px 24px rgba(0,0,0,.45)` });

  /* =====================================================================
     7) FICHA DE ATRIBUTOS do NPC (sliders, barras segmentadas, texto)
     ===================================================================== */
  EX.ficha = function (tl, t, o = {}) {
    const { titulo = 'NPC #0417', sub = 'PERFIL DE COMPORTAMENTO', linhas = [], x = 960, y = 540, larg = 780, passo = .5, icone = 'pessoa' } = o;
    const { box, cena } = base(tl, t, o, { x, y, ry: -10, rx: 4 });

    mk('div', 'ex-ic', cab, { width: '84px', height: '84px', background: '#0b1424', border: `3px solid ${AZ}`, boxShadow: `0 0 18px ${rgba(AZ, .6)}` }, ico(icone, '#e6f1ff', 50));
    mk('div', '', cab, null, `<div style="font:700 40px ${CX};color:#fff;line-height:1.05">${titulo}</div><div style="font:600 24px ${FT};letter-spacing:.16em;color:#8fbfff;margin-top:6px">${sub}</div>`);
    entra(tl, pn, t, { x: 60, rotationY: 25, scale: .92 }, {}, .45, 'expo.out'); som('roda', t);
    const r = aleat(31);
    box._linhas = linhas.map((L, i) => {
      const ti = L.t ?? T(o, i, t + .4 + i * passo);
      const row = mk('div', '', pn, { padding: '16px 30px 20px', borderTop: i ? `1px solid ${rgba(AZ, .18)}` : 'none' });
      mk('div', '', row, { font: `700 25px ${FT}`, letterSpacing: '.12em', color: '#8fbfff', marginBottom: '10px' }, L.rotulo || '');
      const fecha = { height: 0, paddingTop: 0, paddingBottom: 0, autoAlpha: 0, x: 40 };
      row.style.overflow = 'hidden'; gsap.set(row, fecha);
      tl.fromTo(row, Object.assign({}, fecha), { height: 'auto', paddingTop: 16, paddingBottom: 20, autoAlpha: 1, x: 0, duration: .32, ease: 'power2.out', immediateRender: false }, ti);
      som('barra', ti);
      const tipo = L.tipo || (L.texto != null ? 'texto' : 'slider');
      if (tipo === 'texto') {
        const v = mk('div', '', row, { font: `800 40px ${FT}`, letterSpacing: '.03em', color: L.cor || '#fff', textTransform: 'uppercase', minHeight: '44px' });
        digita(tl, v, L.texto, ti + .15);
        return { vai: (tl2, valor, tt) => { tl2.call(() => { v.textContent = valor; }, null, tt); tl2.fromTo(v, { scale: 1.12 }, { scale: 1, duration: .3, immediateRender: false, transformOrigin: '0 50%' }, tt); } };
      }
      if (tipo === 'barra') {
        const seg = L.seg || 10, cor = L.cor || AZ;
        const lin = mk('div', '', row, { display: 'flex', gap: '7px', alignItems: 'center' });
        const ss = [...Array(seg)].map(() => mk('div', '', lin, { flex: '1', height: '26px', transform: 'skewX(-14deg)', background: 'rgba(255,255,255,.1)', borderRadius: '3px' }));
        const pinta = (v, cr) => { const k = Math.round(v * seg); ss.forEach((s, j) => { s.style.background = j < k ? (cr || cor) : 'rgba(255,255,255,.1)'; s.style.boxShadow = j < k ? `0 0 10px ${rgba(cr || cor, .7)}` : 'none'; }); };
        const pr = { v: 0 };
        tl.fromTo(pr, { v: 0 }, { v: L.valor ?? .6, duration: .6, ease: 'power2.out', immediateRender: false, onUpdate: () => pinta(pr.v) }, ti + .12);
        return { vai: (tl2, valor, tt) => { tl2.to(pr, { v: valor, duration: .5, ease: 'power2.inOut', onUpdate: () => pinta(pr.v) }, tt); som('barraVai', tt); } };
      }
      // slider CALMO ↔ ESQUENTADO
      const lin = mk('div', '', row, { display: 'flex', alignItems: 'center', gap: '18px' });
      mk('div', '', lin, { font: `700 26px ${FT}`, color: '#dfe9f7', letterSpacing: '.06em', whiteSpace: 'nowrap', minWidth: '120px' }, L.esq || '');
      const tr = mk('div', '', lin, { flex: '1', height: '14px', borderRadius: '7px', background: `linear-gradient(90deg,${CI},${AZ} 50%,${VM})`, position: 'relative', boxShadow: '0 0 0 2px rgba(0,0,0,.4)' });
      mk('div', '', lin, { font: `700 26px ${FT}`, color: '#dfe9f7', letterSpacing: '.06em', whiteSpace: 'nowrap', minWidth: '120px', textAlign: 'right' }, L.dir || '');
      const kn = mk('div', '', tr, { position: 'absolute', top: '50%', width: '34px', height: '34px', marginLeft: '-17px', marginTop: '-17px', borderRadius: '50%', background: '#fff', border: `4px solid ${AZ}`, boxSizing: 'border-box', boxShadow: `0 0 16px ${rgba(AZ, .9)}` });
      const pr = { v: L.de ?? .5 };
      const pos = () => { kn.style.left = (pr.v * 100) + '%'; kn.style.borderColor = lerpCor(pr.v); kn.style.boxShadow = `0 0 16px ${lerpCor(pr.v)}`; };
      pos();
      let tt = ti + .15, ant = L.de ?? .5;
      if (L.mexe) {
        for (let k = 0; k < 4; k++) { const v = .1 + r() * .8; tl.fromTo(pr, { v: ant }, { v, duration: .17, ease: 'power1.inOut', immediateRender: false, onUpdate: pos }, tt); tt += .17; ant = v; }
